name: Déployer sur alterplan.quiquandou.fr (FTP)

# À chaque push sur main (code ou planning), le site est envoyé par FTP sur l'hébergement.
# Seuls les fichiers modifiés sont envoyés (état gardé sur le serveur : .ftp-deploy-sync-state.json).
#
# Réglages dans l'environnement GitHub « FTP_ALTERPLAN_OVH » (Settings › Environments) :
#   Secrets   : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#               DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, SETUP_CODE (base MySQL OVH, comptes : api/config.php)
#   Variables : FTP_DIR      dossier du sous-domaine sur le serveur OVH (le / final est ajouté au besoin)
#               FTP_PROTOCOL facultatif : ftp (défaut) ou ftps
#               FTP_PORT     facultatif (défaut : 21)
# Tant que FTP_SERVER n'existe pas, le workflow s'arrête sans erreur.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: FTP_ALTERPLAN_OVH
      url: https://alterplan.quiquandou.fr
    steps:
      - name: Identifiants FTP présents ?
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Secrets FTP absents : déploiement ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          dir="${FTP_DIR:-./}"
          case "$dir" in */) ;; *) dir="$dir/" ;; esac
          echo "Dossier cible : $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { node-version: 22 }

      - name: Tests
        if: steps.cfg.outputs.ok == 'true'
        run: node --test tests/*.test.js

      - name: Configuration de l'API (base de données)
        if: steps.cfg.outputs.ok == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_NAME" ]; then
            echo "::notice::Secrets DB_* absents : pas de comptes, le site reste en mode data.json."
            exit 0
          fi
          # var_export échappe les valeurs : aucun secret n'est interprété ni affiché.
          php -r '
            $c = ["dsn" => "mysql:host=" . getenv("DB_HOST") . ";dbname=" . getenv("DB_NAME") . ";charset=utf8mb4",
                  "user" => getenv("DB_USER"), "pass" => getenv("DB_PASSWORD"), "setup_code" => (string)getenv("SETUP_CODE"),
                  "mail_from" => getenv("MAIL_FROM") ?: "alterplan@quiquandou.fr", "site_url" => "https://alterplan.quiquandou.fr"];
            file_put_contents("api/config.php", "<?php\n// Généré au déploiement depuis les secrets GitHub. Ne pas versionner.\nreturn " . var_export($c, true) . ";\n");
          '
          php -l api/config.php

      - name: Tests de l'API (SQLite)
        if: steps.cfg.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/api"
          echo "<?php return ['dsn' => 'sqlite:$RUNNER_TEMP/api/t.sqlite', 'user' => null, 'pass' => null, 'setup_code' => 'secret-code', 'mail_log' => '$RUNNER_TEMP/api/mails.log'];" > "$RUNNER_TEMP/api/config.php"
          export ALTERPLAN_CONFIG="$RUNNER_TEMP/api/config.php" MAIL_LOG="$RUNNER_TEMP/api/mails.log"
          php -S 127.0.0.1:8770 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -s 127.0.0.1:8770 >/dev/null && break; sleep 0.3; done
          bash tests/api.test.sh http://127.0.0.1:8770

      - name: Envoi FTP
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ steps.cfg.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            package.json
            README.md
            CNAME
            .gitignore
